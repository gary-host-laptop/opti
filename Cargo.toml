[package]
name = "opti"
version = "1.6.8"
edition = "2021"
description = "a simple, transparent media viewer"
license = "ISC"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_8"] }
glib = "0.20"
gio = "0.20"
gdk4 = { version = "0.9", features = ["v4_8"] }
gdk4-x11 = { version = "0.9", features = ["xlib"] }
gdk-pixbuf = "0.20"
image = "0.25"
cairo-rs = "0.20"
clap = { version = "4", features = ["derive"] }
gstreamer = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
base64 = "0.22"
